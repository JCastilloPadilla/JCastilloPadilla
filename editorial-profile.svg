<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title description">
  <title id="title">El perfil de José Carlos Castillo Padilla</title>
  <desc id="description">Portada editorial con una breve presentación, sus áreas de interés y FlowTrix como proyecto principal.</desc>
  <defs>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="3" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.07  0 0 0 0 0.05  0 0 0 0.42 0"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="#f4efe4"/>
  <rect width="1200" height="420" filter="url(#paper-grain)" opacity="0.55"/>

  <line x1="72" y1="40" x2="1128" y2="40" stroke="#141210" stroke-width="3"/>
  <text x="72" y="68" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" fill="#141210" letter-spacing="7">TRAZA</text>
  <text x="1128" y="68" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#8a8172" letter-spacing="3">ED. 01 · MMXXVI · MAZATLÁN</text>
  <line x1="72" y1="84" x2="1128" y2="84" stroke="#141210" stroke-width="0.8"/>

  <text x="72" y="164" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" fill="#141210" letter-spacing="-1.5">José Carlos Castillo Padilla</text>
  <text x="72" y="198" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#4a443a">Estudiante de Ingeniería en Sistemas de la Información · FIMAZ-UAS</text>
  <line x1="72" y1="224" x2="1128" y2="224" stroke="#c9c1b0" stroke-width="0.8"/>

  <line x1="412" y1="248" x2="412" y2="366" stroke="#c9c1b0" stroke-width="0.8"/>
  <line x1="752" y1="248" x2="752" y2="366" stroke="#c9c1b0" stroke-width="0.8"/>

  <text x="72" y="262" font-family="Consolas, monospace" font-size="9.5" fill="#8a8172" letter-spacing="3.5">— SOBRE MÍ</text>
  <text x="72" y="292" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#141210">Redes y sistemas</text>
  <text x="72" y="316" font-family="Georgia, serif" font-size="16" fill="#141210">Desarrollo web</text>
  <text x="72" y="340" font-family="Georgia, serif" font-size="16" fill="#141210">Seguridad informática</text>
  <text x="72" y="362" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#6b6355">Aprender construyendo.</text>

  <text x="452" y="262" font-family="Consolas, monospace" font-size="9.5" fill="#8a8172" letter-spacing="3.5">— PROYECTO PRINCIPAL</text>
  <text x="452" y="292" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#141210">FlowTrix</text>
  <text x="452" y="316" font-family="Georgia, serif" font-size="15" fill="#141210">Monitoreo de red desde el arranque.</text>
  <text x="452" y="340" font-family="Georgia, serif" font-size="15" fill="#141210">Agente Windows · API · panel web.</text>
  <text x="452" y="362" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#6b6355">Actualmente en desarrollo.</text>

  <rect x="792" y="244" width="336" height="88" fill="#141210"/>
  <text x="812" y="272" font-family="Consolas, monospace" font-size="9.5" fill="#8a8172" letter-spacing="3.5">— LA IDEA</text>
  <text x="812" y="300" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#f4efe4">“La red deja señales.</text>
  <text x="812" y="322" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#f4efe4">FlowTrix les da contexto.”</text>
  <text x="792" y="362" font-family="Georgia, serif" font-size="15" fill="#4a443a">flowtrix.fimaz.uas.edu.mx</text>

  <line x1="72" y1="386" x2="1128" y2="386" stroke="#141210" stroke-width="2"/>
  <text x="72" y="406" font-family="Consolas, monospace" font-size="9.5" fill="#8a8172" letter-spacing="2.5">JCASTILLOPADILLA · FIMAZ-UAS</text>
  <text x="1128" y="406" text-anchor="end" font-family="Consolas, monospace" font-size="9.5" fill="#8a8172" letter-spacing="2.5">REDES · SISTEMAS · DESARROLLO</text>
</svg>
