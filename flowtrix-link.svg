<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 68" width="344" height="68" role="img" aria-labelledby="title description">
  <title id="title">Explorar FlowTrix</title>
  <desc id="description">Enlace editorial oscuro con un radar animado para conocer el proyecto FlowTrix.</desc>

  <rect x="1" y="1" width="342" height="66" fill="#141210" stroke="#c9c1b0" stroke-width="1"/>
  <text x="20" y="25" font-family="Consolas, monospace" font-size="10" letter-spacing="2.6" fill="#a99f8e">PROYECTO PRINCIPAL</text>
  <text x="20" y="49" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#f4efe4">Explorar FlowTrix</text>
  <text x="230" y="49" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#f4efe4">↗</text>

  <line x1="267" y1="13" x2="267" y2="55" stroke="#6b6355" stroke-width="1"/>
  <g transform="translate(280 9) scale(0.72)">
    <circle cx="35" cy="35" r="32" stroke="#c9c1b0" stroke-width="2" fill="none" opacity="0.3"/>
    <circle cx="35" cy="35" r="24" stroke="#c9c1b0" stroke-width="2" fill="none" opacity="0.4"/>
    <circle cx="35" cy="35" r="16" stroke="#c9c1b0" stroke-width="2" fill="none" opacity="0.5"/>
    <circle cx="35" cy="35" r="4" fill="#f4efe4"/>
    <line x1="35" y1="35" x2="58" y2="12" stroke="#c9c1b0" stroke-width="2.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 35 35" to="360 35 35" dur="3s" repeatCount="indefinite"/>
    </line>
    <circle cx="50" cy="20" r="3" fill="#f4efe4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="25" r="3" fill="#f4efe4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="55" cy="45" r="3" fill="#f4efe4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="15" cy="50" r="3" fill="#f4efe4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <path d="M35 10Q25 15 25 25M35 10Q45 15 45 25" stroke="#c9c1b0" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
  </g>
</svg>
